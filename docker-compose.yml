version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mcp_registry_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5435:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=development
      - PORT=3010
      - DATABASE_URL=postgresql://postgres:postgres123@db:5432/mcp_registry_v2
      - JWT_SECRET=your-super-secret-jwt-key-v2
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./packages/api/src:/app/src:ro
      - ./packages/api/prisma:/app/prisma:ro

  ui:
    build:
      context: .
      dockerfile: packages/ui/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3010
    depends_on:
      - app
    volumes:
      - ./packages/ui/src:/app/src:ro

volumes:
  postgres_data_v2: